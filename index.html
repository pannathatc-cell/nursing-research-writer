<style>
:root{--bg:#EEF2F1;--card:#FFFFFF;--ink:#16302F;--muted:#5B6E6C;--accent:#1F5E62;--soft:#DCEBEA;--warn:#FBEFD5;--warn-ink:#8A5D00}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1A;--card:#172524;--ink:#E4EEEC;--muted:#9BB0AD;--accent:#7CC3C2;--soft:#1F3534;--warn:#3A2E14;--warn-ink:#F2C66B}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px;min-height:100dvh}
main{width:min(520px,100%);background:var(--card);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.12);padding:34px 28px 28px;text-align:center}
.logo{width:88px;height:88px;border-radius:50%;background:var(--soft);display:block;margin:0 auto 14px}
.brand{font-weight:700;font-size:17px;margin:0;color:var(--accent)}
.dev{font-size:13px;color:var(--muted);margin:2px 0 22px}
.lock{font-size:46px;line-height:1;margin:0 0 10px}
h1{font-size:24px;margin:0 0 8px;line-height:1.4}
p.lead{margin:0 0 20px;color:var(--muted);line-height:1.7;font-size:15.5px}
.contact{background:var(--warn);color:var(--warn-ink);border-radius:14px;padding:14px 16px;font-weight:600;font-size:16.5px;line-height:1.6}
footer{margin-top:22px;font-size:12.5px;color:var(--muted)}
</style>
</head>
